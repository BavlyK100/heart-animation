<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heart Animation 💖</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: radial-gradient(circle at center, #1b0711 0%, #0a0a0f 75%);
      overflow: hidden;
      font-family: system-ui, sans-serif;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: clamp(4px, 1.5vw, 8px);
      will-change: transform;
    }

    .cell {
      width: clamp(38px, 10vw, 54px);
      height: clamp(38px, 10vw, 54px);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: clamp(22px, 6vw, 32px);
      opacity: 0;
      transform: scale(0);
      transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      will-change: transform, opacity;
    }
    .cell.visible { opacity: 1; transform: scale(1); }

    /* GPU-only heartbeat animation */
    .grid.complete .cell.heart {
      animation: beat 1.4s ease-in-out infinite;
      animation-delay: calc(var(--i) * 0.05s);
    }
    @keyframes beat {
      0%, 100% { transform: scale(1); }
      20% { transform: scale(1.22); }
      40% { transform: scale(0.96); }
      60% { transform: scale(1.12); }
    }

    /* "I Love You" message */
    .love-text {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      font-size: clamp(28px, 8vw, 52px);
      font-weight: 800;
      font-style: italic;
      color: #fff;
      text-shadow: 0 0 16px rgba(255, 45, 85, 0.7);
      pointer-events: none;
      opacity: 0;
      z-index: 10;
      will-change: transform, opacity;
    }
    .love-text.animate {
      animation: popAndFall 2.8s cubic-bezier(0.2, 0.8, 0.3, 1) forwards;
    }
    @keyframes popAndFall {
      0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.3); }
      18%  { opacity: 1; transform: translate(-50%, -50%) scale(1.15); }
      35%  { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      60%  { opacity: 1; transform: translate(-50%, -40%) scale(1); }
      100% { opacity: 0; transform: translate(-50%, 90vh) rotate(15deg) scale(0.6); }
    }

    /* Lightweight Confetti */
    .confetti {
      position: fixed;
      top: -15px;
      width: 8px;
      height: 12px;
      border-radius: 2px;
      pointer-events: none;
      z-index: 5;
      animation: fall 2.2s linear forwards;
      will-change: transform;
    }
    @keyframes fall {
      0%   { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(105vh) rotate(540deg); opacity: 0; }
    }

    /* Wiggle on shake */
    .grid.wiggle { animation: shake 0.4s ease-in-out; }
    @keyframes shake {
      0%, 100% { transform: scale(1) rotate(0deg); }
      25% { transform: scale(1.08) rotate(-6deg); }
      75% { transform: scale(1.08) rotate(6deg); }
    }

    /* Replay Button */
    .replay-btn {
      position: fixed;
      bottom: clamp(20px, 5vh, 40px);
      border: 1px solid rgba(255, 45, 85, 0.4);
      background: rgba(255, 45, 85, 0.08);
      color: #ff6b8a;
      padding: 10px 24px;
      border-radius: 24px;
      font-size: 14px;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.4s ease;
      z-index: 10;
    }
    .replay-btn.show { opacity: 1; }
  </style>
</head>
<body>

  <div class="grid" id="grid"></div>
  <div class="love-text" id="loveText">I Love You 💖</div>
  <button class="replay-btn" id="replayBtn" onclick="play()">Replay 💖</button>

  <script>
    const ROWS = 6, COLS = 7;
    const isHeart = (r, c) => (r === 0 && c % 3 !== 0) || (r === 1 && c % 3 === 0) || (r - c === 2) || (r + c === 8);
    const grid = document.getElementById('grid');
    const loveText = document.getElementById('loveText');
    const replayBtn = document.getElementById('replayBtn');
    let cells = [];

    function build() {
      grid.innerHTML = '';
      grid.className = 'grid';
      loveText.className = 'love-text';
      replayBtn.className = 'replay-btn';
      cells = [];

      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const el = document.createElement('div');
          el.className = 'cell';
          el.style.setProperty('--i', r * COLS + c);
          if (isHeart(r, c)) {
            el.classList.add('heart');
            el.textContent = '💖';
          }
          grid.appendChild(el);
          cells.push(el);
        }
      }
    }

    function play() {
      build();
      // Reveal row-by-row top to bottom
      for (let r = 0; r < ROWS; r++) {
        setTimeout(() => {
          for (let c = 0; c < COLS; c++) cells[r * COLS + c].classList.add('visible');
        }, r * 150);
      }

      // Heartbeat + Confetti + Love message
      setTimeout(() => {
        grid.classList.add('complete');
        replayBtn.classList.add('show');
        setTimeout(() => {
          loveText.classList.add('animate');
          spawnConfetti();
        }, 1200);
      }, ROWS * 150 + 200);
    }

    function spawnConfetti() {
      const colors = ['#ff2d55', '#ff9eb5', '#ffd700', '#ffffff', '#ff69b4'];
      for (let i = 0; i < 30; i++) {
        const p = document.createElement('div');
        p.className = 'confetti';
        p.style.left = (Math.random() * 100) + 'vw';
        p.style.background = colors[i % colors.length];
        p.style.animationDelay = (Math.random() * 0.4) + 's';
        p.style.animationDuration = (1.8 + Math.random()) + 's';
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 2600);
      }
    }

    // Smooth Mobile Tilt (throttled with requestAnimationFrame)
    let tiltX = 0, tiltY = 0, ticking = false;
    window.addEventListener('deviceorientation', e => {
      if (e.gamma == null) return;
      tiltX = Math.max(-12, Math.min(12, e.gamma)) * 0.5;
      tiltY = Math.max(-12, Math.min(12, (e.beta - 45) || 0)) * 0.5;
      if (!ticking) {
        requestAnimationFrame(() => {
          grid.style.transform = `translate3d(${tiltX}px, ${tiltY}px, 0)`;
          ticking = false;
        });
        ticking = true;
      }
    }, { passive: true });

    // Shake detection
    let lastAccel = 0, lastShake = 0;
    window.addEventListener('devicemotion', e => {
      const a = e.accelerationIncludingGravity;
      if (!a) return;
      const speed = Math.abs(a.x + a.y + a.z - lastAccel);
      lastAccel = a.x + a.y + a.z;
      const now = Date.now();
      if (speed > 22 && now - lastShake > 900) {
        lastShake = now;
        grid.classList.add('wiggle');
        setTimeout(() => grid.classList.remove('wiggle'), 400);
      }
    }, { passive: true });

    // Start
    play();
  </script>
</body>
</html>
